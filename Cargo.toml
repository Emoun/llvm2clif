[package]
name = "llvm2clif"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Translate LLVM IR (.ll) into Cranelift IR and compile it for the Scry ISA"
repository = "https://github.com/emoun/llvm2clif"
default-run = "llvm2clif"

[[bin]]
name = "llvm2clif"
path = "src/main.rs"

[[bin]]
name = "scry-cc"
path = "src/bin/scry_cc.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }

# Cranelift with the Scry backend, from the Scry project's wasmtime fork.
cranelift-codegen = { git = "https://github.com/Scry-arch/rust-wasmtime.git", rev = "a5daf64bf20e9927a1d738f3d2ed1b8f128af4a3", features = ["scry"] }
cranelift-frontend = { git = "https://github.com/Scry-arch/rust-wasmtime.git", rev = "a5daf64bf20e9927a1d738f3d2ed1b8f128af4a3" }
cranelift-module = { git = "https://github.com/Scry-arch/rust-wasmtime.git", rev = "a5daf64bf20e9927a1d738f3d2ed1b8f128af4a3" }
cranelift-object = { git = "https://github.com/Scry-arch/rust-wasmtime.git", rev = "a5daf64bf20e9927a1d738f3d2ed1b8f128af4a3" }
cranelift-reader = { git = "https://github.com/Scry-arch/rust-wasmtime.git", rev = "a5daf64bf20e9927a1d738f3d2ed1b8f128af4a3" }

[dev-dependencies]
cranelift-interpreter = { git = "https://github.com/Scry-arch/rust-wasmtime.git", rev = "a5daf64bf20e9927a1d738f3d2ed1b8f128af4a3" }

[profile.release]
debug = false
